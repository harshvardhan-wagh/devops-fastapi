name: Secret Test

on: workflow_dispatch

jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - name: Print it directly
        run: echo "Token is ${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Print it via an env var
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "From env $TOKEN"

      - name: Transform it first
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Base64: $(printf '%s' "$TOKEN" | base64 -w0)"
          echo "Length: ${#TOKEN}"
          echo "Spaced: $(printf '%s' "$TOKEN" | sed 's/./& /g')"
