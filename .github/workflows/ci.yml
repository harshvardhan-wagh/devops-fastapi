name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: harshwagh/devops-fastapi

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, k8s]
    concurrency: deploy-devops-demo
    steps:
      - name: Update image
        run: |
          kubectl set image deployment/fastapi \
            fastapi=${{ env.IMAGE }}:${{ github.sha }} \
            -n devops-demo

      - name: Record why it changed
        run: |
          kubectl annotate deployment/fastapi \
            kubernetes.io/change-cause="deploy ${{ github.sha }}" \
            --overwrite -n devops-demo

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fastapi \
            -n devops-demo --timeout=120s

      - name: Show what is running
        run: |
          kubectl get pods -n devops-demo -o wide
          echo "Running image:"
          kubectl get deployment fastapi -n devops-demo \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
