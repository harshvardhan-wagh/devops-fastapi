name: Show Secret

on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Masked versus not masked
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "=============================="
          echo "MASKED   : $TOKEN"
          echo "NOT MASKED: $(printf '%s' "$TOKEN" | sed 's/./& /g')"
          echo "=============================="
