name: Secret Test

on: workflow_dispatch

jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - name: Print it directly
        run: |
          echo "Token is: ${{ secrets.DOCKERHUB_TOKEN }}"
          echo "Username is: ${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Print it via an env var
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "From env: $TOKEN"

      - name: Transform it first
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Reversed: $(echo -n "$TOKEN" | rev)"
          echo "Base64:   $(echo -n "$TOKEN" | base64)"
          echo "Length:   ${#TOKEN}"
